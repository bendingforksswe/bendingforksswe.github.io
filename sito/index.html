<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bending Forks · Gruppo 15</title>
  <meta name="description" content="Documentazione del gruppo 15 Bending Forks, progetto di Ingegneria del Software 2026/27, Università di Padova.">
  <link rel="icon" href="assets/img/favicon.png">
  <script>
    // Tema scelto dall'utente (se c'è) applicato prima del rendering, per evitare il lampo di colore
    try { const t = localStorage.getItem("tema"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="assets/css/stile.css">
</head>
<body>
  <header class="testata">
    <div class="contenitore testata-riga">
      <a class="marchio" href="#top">
        <img src="assets/img/favicon.png" alt="" width="40" height="40">
        <span>BENDING FORKS</span>
      </a>
      <nav class="salti" id="salti" aria-label="Sezioni"></nav>
      <div class="azioni">
        <button class="tema" id="tema" type="button" aria-label="Cambia tema"></button>
      </div>
    </div>
  </header>

  <main id="top" class="contenitore">
    <div id="contenuto"></div>
  </main>

  <footer class="piede">
    <div class="contenitore piede-riga">
      <div class="piede-info">
        <strong id="piede-nome"></strong>
        <span id="piede-corso"></span>
      </div>
      <div class="piede-link" id="piede-link"></div>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/documenti.js"></script>
  <script src="assets/js/sito.js"></script>
</body>
</html>
