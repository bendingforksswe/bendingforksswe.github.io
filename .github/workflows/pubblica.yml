name: Compila e pubblica il sito

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [documenti-aggiornati]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      serve: ${{ steps.confronto.outputs.serve }}
    steps:
      - name: Ultimo commit di documenti-swe
        id: sha
        run: echo "sha=$(git ls-remote https://github.com/bendingforksswe/documenti-swe.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
      - name: Confronto con il commit pubblicato
        id: confronto
        run: |
          # Il controllo periodico ricompila solo se documenti-swe è cambiata; gli altri eventi ricompilano sempre
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "serve=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          pubblicato=$(curl -fsSL https://bendingforksswe.github.io/versione.json | sed -n 's/.*"documenti": *"\([0-9a-f]*\)".*/\1/p' || true)
          echo "Pubblicato: ${pubblicato:-nessuno} · Ultimo: ${{ steps.sha.outputs.sha }}"
          [ "$pubblicato" = "${{ steps.sha.outputs.sha }}" ] && echo "serve=false" >> "$GITHUB_OUTPUT" || echo "serve=true" >> "$GITHUB_OUTPUT"

  compila:
    needs: controlla
    if: needs.controlla.outputs.serve == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bendingforksswe/documenti-swe
          ref: ${{ needs.controlla.outputs.sha }}
          path: documenti
      - name: Installa LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-lang-italian
      - name: Compila documenti e sito
        env:
          DOCUMENTI_SHA: ${{ needs.controlla.outputs.sha }}
        run: python3 scripts/compila.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pubblica:
    needs: compila
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
